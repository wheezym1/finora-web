<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizar compra · FINORA</title>
<meta name="description" content="Finaliza tu compra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>

<div class="wrap"><div class="page-head"><div class="crumbs"><a href="index.html">Inicio</a> / <a href="carrito.html">Carrito</a> / Finalizar compra</div><h1>Finalizar compra</h1></div>
<section class="section" style="padding-top:10px"><div id="box"></div></section></div>

</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>

Finora.ready.then(async () => {
  const box = document.getElementById('box');
  const cart = Cart.get();
  if (!cart.length) { location.href = 'carrito.html'; return; }
  const prods = [];
  for (const it of cart) { try { prods.push({ p: await api('/api/products/' + it.id), qty: it.qty }); } catch {} }
  const subtotal = prods.reduce((a, r) => a + r.p.price * r.qty, 0);
  const cfg = Finora.config; const ship = subtotal >= cfg.freeShippingFrom ? 0 : cfg.shippingCost;
  box.innerHTML = `<form class="two" id="f" novalidate>
    <div>
      <div class="panel" style="margin-bottom:20px"><h2>Datos de envío</h2>
        <div class="row2"><div class="field"><label for="name">Nombre completo</label><input id="name" required  autocomplete="name"></div>
        <div class="field"><label for="phone">Teléfono / WhatsApp</label><input id="phone" required inputmode="tel" placeholder="999 999 999" autocomplete="tel"></div></div>
        <div class="field"><label for="address">Dirección</label><input id="address" required placeholder="Calle, número, referencia" autocomplete="street-address"></div>
        <div class="field" style="margin-bottom:0"><label for="city">Ciudad</label><input id="city" required placeholder="Lima, Arequipa, Cusco…" autocomplete="address-level2"></div></div>
      <div class="panel"><h2>Método de pago</h2>
        <label class="pay-opt"><input type="radio" name="m" value="yape" checked><span><b>Yape</b><small>Paga desde tu celular y confirma con el código de operación.</small></span></label>
        <label class="pay-opt"><input type="radio" name="m" value="plin"><span><b>Plin</b><small>Paga desde tu banca móvil y confirma con el código de operación.</small></span></label>
        <label class="pay-opt"><input type="radio" name="m" value="otro"><span><b>Otro medio</b><small>Transferencia o tarjeta: lo coordinamos por WhatsApp.</small></span></label>
      </div>
    </div>
    <aside class="panel"><h2>Tu pedido</h2>
      ${prods.map(({ p, qty }) => `<div class="sum-row"><span>${qty} × ${esc(p.name)}</span><span>${money(p.price * qty)}</span></div>`).join('')}
      <div class="sum-row" style="margin-top:8px"><span>Envío</span><span>${ship ? money(ship) : 'Gratis'}</span></div>
      <div class="sum-row total"><span>Total</span><span>${money(subtotal + ship)}</span></div>
      <div id="err" class="msg err" hidden style="margin-top:16px"></div>
      <button class="btn btn-gold block" id="go" style="margin-top:18px">Enviar pedido por WhatsApp</button>
      <p class="note">Se abrirá WhatsApp con tu pedido y te indicaremos cómo pagar.</p></aside></form>`;
  const err = document.getElementById('err');
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault(); err.hidden = true;
    const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Creando pedido…';
    const g = id => document.getElementById(id).value.trim();
    const mth = { yape: 'Yape ' + CONFIG.yape, plin: 'Plin ' + CONFIG.plin, otro: 'Otro medio (a coordinar)' }[document.querySelector('input[name=m]:checked').value];
    const msg = 'Hola FINORA, quiero hacer este pedido:\n' + prods.map(r => `• ${r.qty} × ${r.p.name} — ${money(r.p.price * r.qty)}`).join('\n') +
      `\nEnvío: ${ship ? money(ship) : 'Gratis'}\nTOTAL: ${money(subtotal + ship)}\n\nNombre: ${g('name')}\nTeléfono: ${g('phone')}\nDirección: ${g('address')}, ${g('city')}\nPago: ${mth}`;
    Cart.clear(); btn.disabled = true; btn.textContent = 'Pedido enviado';
    location.href = waLink(msg);
  });
});

</script>
</body>
</html>
